<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoDNA Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#e8f5e9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:420px;
border-radius:20px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#198754;
margin-bottom:25px;
}
</style>

</head>

<body>

<div class="card">

<h2>🌱 EcoDNA Register</h2>

<form id="registerForm">

<input class="form-control mb-3" id="name" placeholder="Full Name" required>

<input class="form-control mb-3" id="email" type="email" placeholder="Email" required>

<input class="form-control mb-3" id="password" type="password" placeholder="Password" required>

<button class="btn btn-success w-100">
Register
</button>

</form>

<br>

<a href="login.html" class="btn btn-outline-success w-100">
Already have an account?
</a>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit",function(e){

e.preventDefault();

const user={

name:document.getElementById("name").value,

email:document.getElementById("email").value,

password:document.getElementById("password").value

};

localStorage.setItem("user",JSON.stringify(user));

alert("Registration Successful!");

window.location="login.html";

});

</script>

</body>
</html>
