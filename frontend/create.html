<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create EcoDNA</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

<div class="container">

<a class="navbar-brand fw-bold text-success fs-3" href="index.html">
🌱 EcoDNA
</a>

</div>

</nav>

<section class="py-5">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="dashboard-box">

<h2 class="text-center mb-4">
Generate Your EcoDNA
</h2>

<form id="ecoForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>Building Name</label>

<input type="text" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Location</label>

<input type="text" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Building Type</label>

<select class="form-select">

<option>Residential</option>

<option>Commercial</option>

<option>Industrial</option>

<option>Educational</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Construction Year</label>

<input type="number" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Roof Area (sq.ft)</label>

<input type="number" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Monthly Electricity (kWh)</label>

<input type="number" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Monthly Water Usage (Litres)</label>

<input type="number" class="form-control" required>

</div>

<div class="col-md-6 mb-3">

<label>Number of Occupants</label>

<input type="number" class="form-control" required>

</div>

<div class="col-md-12 mb-3">

<label>Main Building Material</label>

<select class="form-select">

<option>Concrete</option>

<option>Brick</option>

<option>Steel</option>

<option>Wood</option>

</select>

</div>

<div class="col-12 text-center mt-4">

<button type="submit" class="btn btn-success btn-lg px-5">
Generate EcoDNA Report
</button>

</div>

</div>

</form>
<div id="resultCard" class="card shadow-lg mt-5 border-0" style="display:none;">
    <div class="card-body">

        <h2 class="text-center text-success mb-4">
            🌱 EcoDNA Sustainability Report
        </h2>

        <h4 id="buildingTitle"></h4>

        <hr>

        <div class="row text-center">

            <div class="col-md-4">
                <h5>Overall Score</h5>
                <h1 id="overallScore" class="text-success"></h1>
            </div>

            <div class="col-md-4">
                <h5>Carbon</h5>
                <h2 id="carbon"></h2>
            </div>

            <div class="col-md-4">
                <h5>Energy</h5>
                <h2 id="energy"></h2>
            </div>

            <div class="col-md-4 mt-4">
                <h5>Water</h5>
                <h2 id="water"></h2>
            </div>

            <div class="col-md-4 mt-4">
                <h5>Climate</h5>
                <h2 id="climate"></h2>
            </div>

            <div class="col-md-4 mt-4">
                <h5>Biodiversity</h5>
                <h2 id="bio"></h2>
            </div>

        </div>

        <hr>

        <h4>🤖 AI Recommendations</h4>

        <ul class="list-group">

            <li class="list-group-item">☀ Install Rooftop Solar Panels</li>

            <li class="list-group-item">💧 Install Rainwater Harvesting</li>

            <li class="list-group-item">💡 Replace old lights with LEDs</li>

            <li class="list-group-item">🌳 Increase Green Cover</li>

        </ul>

    </div>
</div>

</div>

</div>

</div>

</div>

</section>

<script src="js/main.js"></script>

</body>

</html>
